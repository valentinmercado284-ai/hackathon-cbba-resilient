<!DOCTYPE html>

<div class="chips" id="bases"></div><div class="chips" id="ovs"></div>

<div id="mp"><svg id="sv0"><image id="im0" preserveAspectRatio="none"/></svg><div id="tl"></div><svg id="sv"></svg>

<div class="chips" id="hzs"></div>
<p class="note" data-i="mN"></p>
<div class="card" id="minfo"></div>
</section>

<section id="v-granja" hidden>
<h2 data-i="vg2"></h2>
<div class="card">
<label data-i="fN"></label><input id="f-n" data-p="fNp">
<label data-i="fM"></label><select id="f-m"></select>
<label data-i="fL"></label><input id="f-c" readonly data-p="fLp">

<label data-i="fD"></label><input id="f-d" type="date">
<label data-i="fW"></label><input id="f-w" type="number">
</details>
<button class="btn" onclick="saveFarm()" data-i="fSave"></button><button class="btn o" onclick="delFarm()" data-i="fDel"></button>
<div id="fok"></div>
</div>
</section>

<section id="v-stats" hidden><h2 data-i="vs2"></h2><div id="stats"></div></section>

<section id="v-alertas" hidden>
<h2 data-i="aT"></h2>
<div class="card"><h3 data-i="aToday"></h3><div id="als"><p class="sub" data-i="aHint"></p></div><button class="btn" onclick="alerts()" data-i="aCheck"></button></div>
<div class="card"><h3 data-i="sT"></h3>
<label data-i="sN"></label><input id="s-n"><label data-i="sE"></label><input id="s-e" type="email" placeholder="correo@ejemplo.com"><label data-i="sW"></label><input id="s-w" placeholder="+591 ...">
<div class="chips" id="s-t"></div>
<button class="btn" onclick="subscribe()" data-i="sBtn"></button><button class="btn o" onclick="testMail()" data-i="sTest"></button>
<p class="note" id="s-m"></p>
<details><summary data-i="admT"></summary><p class="note" data-i="admH"></p><input id="api" placeholder="https://script.google.com/macros/s/.../exec"><button class="btn o" onclick="saveApi()" data-i="save"></button></details></div>
</section>

<section id="v-chat" hidden>
<h2 data-i="cT"></h2>
<div class="card"><div id="msgs"></div><div class="chips" id="cc"></div>
<div style="display:flex;gap:8px"><input id="ci" data-p="cPh"><button class="btn" style="margin:0" onclick="sendC()" data-i="cSend"></button></div>
<details><summary data-i="cCfg"></summary><label data-i="cModel"></label><input id="cm" placeholder="gpt-5.3-chat-latest"><label data-i="cKey"></label><input id="ck" type="password" placeholder="sk-..."><button class="btn o" onclick="saveCfg()" data-i="save"></button><p class="note" data-i="cNote"></p></details></div>

<div class="card"><h3 data-i="lDo"></h3><div id="learn"></div><p class="note" data-i="lNote"></p></div>
<div class="card"><h3 data-i="lSt"></h3><ul id="lsrc"></ul><p class="note" data-i="lSn"></p></div>
</section>

<section id="v-compartir" hidden>
<h2 data-i="shT"></h2><div class="card"><p class="sub" data-i="shH"></p>
<img id="qr" class="qr" alt="QR" hidden>
<input id="shu" placeholder="https://..." oninput="qrUpd()">
<button class="btn" onclick="copyU()" data-i="shCopy"></button><a class="btn" id="shwa" style="display:inline-block;text-decoration:none;background:#25d366;color:#073b1a" target="_blank" rel="noopener" data-i="shWa"></a></div>

<button id="fab" onclick="go('chat')">💬 Cosecha</button>
