<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cochabamba Resiliente</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#22201c;--mute:#625c52;--brand:#1b6b3a;--soft:#e3f0e6;--line:#ddd6c8;--nasa:#0b3d91;--r:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121714;--card:#1c241f;--ink:#eef3ef;--mute:#b4c0b8;--brand:#7fd39a;--soft:#223329;--line:#33423a;--nasa:#6ea4ff;--r:#ff7b73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:6px;background:#1b6b3a;color:#fff;padding:8px 10px;flex-wrap:nowrap}
.top b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}#lg{display:flex;gap:4px}
.top button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:12px;padding:8px 9px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.top button.on{background:#fff;color:#1b6b3a}
main{max-width:820px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:27px;margin:6px 0;color:var(--brand);line-height:1.15}h2{font-size:21px;margin:0 0 8px}h3{font-size:17px;margin:12px 0 4px}
.sub{color:var(--mute);font-size:15px;margin:0 0 8px}.note{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.nasa{background:var(--nasa);color:#fff;border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
.alert{background:#b71c1c;color:#fff;border-radius:14px;padding:12px;font-size:15px;margin:10px 0}.alert a{color:#fff}
.demo{background:#fff3cd;color:#664d03;border-radius:12px;padding:10px;font-size:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mi{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:14px;font:inherit;cursor:pointer}
.mi:hover{border-color:var(--brand)}.mi b{display:block;font-size:19px}.mi span{color:var(--mute);font-size:14px}
#menu{position:fixed;inset:0;background:var(--bg);z-index:100;padding:16px;overflow:auto;display:none}#menu.on{display:block}
label{display:block;font-weight:600;font-size:15px;margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.btn{background:var(--brand);color:#fff;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.btn.o{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}.chip.on{border-color:var(--brand);background:var(--soft);font-weight:700}
#mp{position:relative;height:64vh;min-height:380px;border-radius:14px;overflow:hidden;background:#1d2428;touch-action:none;border:1px solid var(--line);cursor:grab;user-select:none;-webkit-user-select:none}
#mp>svg,#tl{position:absolute;left:0;top:0;width:100%;height:100%}#tl{overflow:hidden}#tl img{position:absolute;max-width:none;pointer-events:none;user-select:none}#mp>svg{pointer-events:none}
.zc{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}.zc button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
#mbn{position:absolute;left:8px;right:60px;bottom:8px;z-index:5;background:rgba(0,0,0,.72);color:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;display:none}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}.kp div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}.kp b{display:block;font-size:22px}.kp small{color:var(--mute);font-size:12px}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;color:#fff;font-weight:700;font-size:13px}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:700}
.msg{max-width:90%;padding:10px 12px;border-radius:16px;margin:8px 0;white-space:pre-wrap}.msg.u{background:var(--brand);color:#fff;margin-left:auto}.msg.a{background:var(--soft)}#msgs{height:46vh;overflow:auto}
.al{border-left:6px solid var(--r);background:var(--soft);border-radius:10px;padding:10px;margin:8px 0}
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:30px;background:var(--brand);color:#fff;font:inherit;font-weight:700;padding:14px 18px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:200;display:none;max-width:90%;text-align:center}
.qr{display:block;margin:10px auto;width:260px;max-width:80%;background:#fff;padding:8px;border-radius:12px}
[hidden]{display:none!important}
</style>
</head>

try{var r=await fetch("https://power.larc.nasa.gov/api/temporal/daily/point?parameters=PRECTOTCORR,T2M,T2M_MIN,GWETROOT,RH2M&community=AG&longitude="+FARM.lon+"&latitude="+FARM.lat+"&start=20100101&end="+e+"&format=JSON",{signal:ac.signal}),j=await r.json();FS=calc(j.properties.parameter);FS.lv=lev(FS);return FS}finally{clearTimeout(to)}}
function chart(ch){var w=330,h=130,mx=Math.max.apply(0,ch.map(function(c){return Math.max(c.v,c.n||0)}))||1,bw=w/12,s='<svg viewBox="0 0 '+w+" "+(h+16)+'" style="width:100%">';
ch.forEach(function(c,i){var bh=c.v/mx*h,nh=(c.n||0)/mx*h;s+='<rect x="'+(i*bw+4)+'" y="'+(h-bh)+'" width="'+(bw-8)+'" height="'+bh+'" fill="#1565c0" rx="3"/><line x1="'+(i*bw+2)+'" x2="'+((i+1)*bw-2)+'" y1="'+(h-nh)+'" y2="'+(h-nh)+'" stroke="#c62828" stroke-width="3"/><text x="'+(i*bw+bw/2)+'" y="'+(h+13)+'" font-size="9" text-anchor="middle" fill="currentColor">'+c.k.slice(4)+"</text>"});return s+"</svg>"}
function recs(){var c=CROPS[FARM.k||"maiz"],s=FS,l=s.lv,need=Math.round(c[0]*90/c[1]),bal=s.pr-need,nm=t("c_"+(FARM.k||"maiz")),r=[];
r.push(bal<0?t("rW1",s.pr,nm,need,-bal):t("rW2",s.pr,nm,need));if(l.s>=2)r.push(t("rS",t("l"+l.s).toLowerCase()));if(l.h>=2&&c[2])r.push(t("rH",s.fz));if(l.f>=2)r.push(t("rF",s.hv));if(l.i>=2)r.push(t("rI"));if(FARM.p=="2")r.push(t("rSl"));
[3,0,2,1].forEach(function(k){if(l[KEYS[k]]>=2)r=r.concat(tl("a_"+KEYS[k]))});return r.slice(0,9)}
async function showStats(){var el=$("stats");if(FARM.lat===undefined){el.innerHTML='<div class="card">'+t("sFirst")+"</div>";return}
el.innerHTML='<div class="card">'+t("sLoad")+"</div>";
try{if(!FS)await load()}catch(e){el.innerHTML='<div class="card"><b>'+t("sFail",(e&&e.message)||"")+"</b></div>";return}
var s=FS,l=s.lv,ov=Math.max(l.s,l.i,l.f,l.h),c=CROPS[FARM.k||"maiz"];if(MAPOK)draw();minfo();
el.innerHTML=(s.demo?'<div class="demo">'+t("sDemo")+"</div>":"")+'<div class="card"><h3>'+(FARM.n||t("vg"))+" · "+M[FARM.mun][0]+"</h3><p>"+t("sLvl")+': <span class="tag" style="background:'+HC[ov]+'">'+t("l"+ov)+"</span></p>"+
'<div class="kp"><div><b>'+s.prp+" %</b><small>"+t("k1",s.pr)+"</small></div><div><b>"+s.smp+" %</b><small>"+t("k2")+"</small></div><div><b>"+s.fz+"</b><small>"+t("k3")+"</small></div><div><b>"+s.rh+" %</b><small>"+t("k4")+"</small></div></div>"+
"<h3>"+t("sCh")+"</h3>"+chart(s.ch)+'<p class="note">'+t("sChn")+"</p><h3>"+t("sRec")+"</h3><ul>"+recs().map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul>"+
"<details><summary>"+t("sAdv")+'</summary><div class="kp"><div><b>'+s.t+" °C</b><small>"+t("k5")+"</small></div><div><b>"+s.tr+" °C</b><small>"+t("k6")+"</small></div><div><b>"+s.hv+"</b><small>"+t("k7")+"</small></div><div><b>"+s.dry+"</b><small>"+t("k8")+'</small></div></div><p class="note">'+t("sNeed",c[0])+"</p></details>"+
'<p class="note">'+t("sSrc",/^\d{8}$/.test(s.fecha)?s.fecha.slice(0,4)+"-"+s.fecha.slice(4,6)+"-"+s.fecha.slice(6):s.fecha)+"</p></div>"}
/* ===== Alertas por correo ===== */
function apiUrl(){return ls("api")||CFG.API}
function api(action,o){var u=apiUrl();if(!u)return Promise.reject(new Error("noapi"));var q=Object.keys(o).map(function(k){return k+"="+encodeURIComponent(o[k])}).join("&");return fetch(u+"?action="+action+"&"+q).then(function(r){return r.json()})}
async function alerts(){var el=$("als");if(FARM.lat===undefined){el.innerHTML="<p>"+t("aNo")+"</p>";return}el.innerHTML="<p>"+t("aWait")+"</p>";var out=[];
if(CFG.DEMO){out=[t("aDemo")+t("aRain",18),t("aDemo")+t("aDry")]}else{
try{var j=await(await fetch("https://api.open-meteo.com/v1/forecast?latitude="+FARM.lat+"&longitude="+FARM.lon+"&daily=precipitation_sum,temperature_2m_min&forecast_days=3&timezone=auto")).json(),d=j.daily,mn=Math.min(d.temperature_2m_min[1],d.temperature_2m_min[2]);
if(d.precipitation_sum[1]>=15)out.push(t("aRain",Math.round(d.precipitation_sum[1])));if(mn<=2)out.push(t("aFrost",mn));if(!out.length)out.push(t("aOk"))}catch(e){out.push(t("aFail"))}
try{if(!FS)await load();var l=FS.lv;if(l.s>=2)out.push(t("aDry"));if(l.i>=2)out.push(t("aFire"))}catch(e){}}
$("als").innerHTML=out.map(function(x){return'<div class="al">'+x+"</div>"}).join("");window.AL=out}
var TS=[1,1,1,1],TC4=["rain","frost","dry","fire"];
function renderSub(){$("s-t").innerHTML=TC4.map(function(c,i){return'<button class="chip'+(TS[i]?" on":"")+'" onclick="TS['+i+']^=1;renderSub()">'+t("t_"+c)+"</button>"}).join("")}
function subData(){return{name:$("s-n").value,email:$("s-e").value.trim(),wa:$("s-w").value,lat:FARM.lat,lon:FARM.lon,mun:M[FARM.mun]?M[FARM.mun][0]:"",crop:FARM.k||"",lang:LANG,types:TC4.filter(function(c,i){return TS[i]}).join(",")}}
async function subscribe(){var s=subData(),m=$("s-m");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.email)){m.textContent=t("sBad");return}if(FARM.lat===undefined){m.textContent=t("sFarm");return}
ls("sub",JSON.stringify(s));if(!apiUrl()){m.textContent=t("sNoApi");return}m.textContent=t("aWait");
try{var r=await api("subscribe",s);m.textContent=r.ok?t("sSent"):t("sErr",r.error||"?")}catch(e){m.textContent=t("sErr",e.message)}}
async function testMail(){var s=subData(),m=$("s-m");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.email)){m.textContent=t("sBad");return}if(FARM.lat===undefined){m.textContent=t("sFarm");return}
if(!apiUrl()){var b=(window.AL||[t("aOk")]).join("\n");location.href="mailto:"+s.email+"?subject="+encodeURIComponent("Cochabamba Resiliente")+"&body="+encodeURIComponent(b);return}
m.textContent=t("aWait");try{var r=await api("test",s);m.textContent=r.ok?t("sSent"):t("sErr",r.error||"?")}catch(e){m.textContent=t("sErr",e.message)}}
function saveApi(){ls("api",$("api").value.trim());toast(t("saved"))}
/* ===== Cosecha ===== */
var CH=[],busy=0;
function say(r,x){CH.push({r:r,t:x});var d=document.createElement("div");d.className="msg "+r;d.textContent=x;$("msgs").appendChild(d);$("msgs").scrollTop=1e6;return d}
function initChat(){$("cm").value=ls("cm")||"";$("ck").value=ls("ck")||"";$("api").value=ls("api")||"";if(!CH.length){say("a",t("cHello"));$("cc").innerHTML=tl("cq").map(function(x){return'<button class="chip" onclick="askC(this.textContent)">'+x+"</button>"}).join("")}}
function saveCfg(){ls("cm",$("cm").value.trim());ls("ck",$("ck").value.trim());toast(t("saved"))}
function sendC(){var x=$("ci").value.trim();if(x){$("ci").value="";askC(x)}}
function ctx(){var f=FARM,c="Zona: Cochabamba, Bolivia. Emergencia nacional por Súper Niño 2026-27.";if(f.lat!==undefined){var m=M[f.mun];c+=" Granja: "+(f.n||"sin nombre")+", municipio "+m[0]+" ("+t("t_"+m[3])+"), cultivo "+(CROPS[f.k]?t("c_"+f.k):"no indicado")+", "+(f.h||"?")+" ha."}if(FS&&!FS.demo)c+=" Datos NASA POWER de su granja: lluvia 90 días "+FS.prp+"% vs normal ("+FS.pr+" mm), humedad del suelo "+FS.smp+"% vs normal, "+FS.fz+" días con noche fría, "+FS.hv+" días de lluvia fuerte, humedad del aire "+FS.rh+"%.";return c}
function rule(q){q=q.toLowerCase();if(/ni[ñn]o/.test(q))return t("rNino");if(/rieg|agua|sequ|yaku|drought|water|irrig/.test(q))return t("rAgua");if(/helad|qasa|frost/.test(q))return t("rHel");if(/dato|granja|estad|data|farm|yupay/.test(q)&&FS&&!FS.demo)return t("rDato",FS.prp,FS.smp);return t("rDef")}
function sysPrompt(){var lg=LANG=="en"?"Reply in English.":LANG=="qu"?"Responde en quechua boliviano (variedad de Cochabamba, alfabeto oficial boliviano). Nunca uses quechua peruano. Frases muy simples; si no estás seguro de una palabra, usa la palabra en español.":"Responde en español.";
return "Eres «Cosecha», asistente de una app para agricultores de Cochabamba, Bolivia. "+lg+" Habla muy sencillo, frases cortas, máximo 110 palabras; usa viñetas «•» si das pasos. Apóyate en el CONTEXTO y di que los datos vienen de la NASA cuando los uses. No inventes cifras, precios ni teléfonos. Para decisiones importantes recomienda hablar con un técnico agrónomo, la alcaldía o INIAF. CONTEXTO: "+ctx()}
async function llm(msgs){var u=apiUrl(),k=ls("ck"),mod=ls("cm")||"gpt-5.3-chat-latest";
if(u){var r=await fetch(u,{method:"POST",body:JSON.stringify({action:"chat",messages:msgs})}),j=await r.json();if(j.error)throw new Error(j.error);return j.text}
if(k){var r2=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+k},body:JSON.stringify({model:mod,messages:msgs})}),j2=await r2.json();if(j2.error)throw new Error(j2.error.message);return j2.choices[0].message.content}return null}
async function askC(q){if(busy)return;busy=1;$("cc").innerHTML="";say("u",q);var box=say("a","…"),a=null;
try{var h=CH.slice(-9,-2).map(function(x){return{role:x.r=="u"?"user":"assistant",content:x.t}});h.unshift({role:"system",content:sysPrompt()});h.push({role:"user",content:q});a=await llm(h);if(!a)a=rule(q)+"\n\n"+t("cMore")}catch(e){a=t("cFail",e.message)+"\n"+rule(q)}
box.textContent=a;CH[CH.length-1]={r:"a",t:a};busy=0;$("msgs").scrollTop=1e6}
/* ===== Compartir ===== */
function shareUrl(){if(CFG.PUBLIC)return CFG.PUBLIC;return/^https?:/.test(location.href)?location.href.split("#")[0]:""}
function qrUpd(){var u=$("shu").value.trim(),im=$("qr");if(!u){im.hidden=true;return}im.hidden=false;$("shwa").href="https://wa.me/?text="+encodeURIComponent(t("shMsg")+" "+u);
if(CFG.QR&&u==CFG.PUBLIC){im.src=CFG.QR}else{im.onerror=function(){if(CFG.QR&&im.src!=CFG.QR)im.src=CFG.QR};im.src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data="+encodeURIComponent(u)}}
function copyU(){var i=$("shu");i.select();try{navigator.clipboard.writeText(i.value).then(function(){toast(t("shOk"))},function(){document.execCommand("copy");toast(t("shOk"))})}catch(e){document.execCommand("copy");toast(t("shOk"))}}
/* ===== Navegación e idioma ===== */
var VW=[["mapa","vm","dm","🗺️"],["granja","vg","dg","🌾"],["stats","vs","ds","📊"],["alertas","va","da","🔔"],["chat","vc","dc","💬"],["aprende","vl","dl","📚"],["compartir","vh","dh","🔗"]],ALLV=["inicio"].concat(VW.map(function(v){return v[0]}));
function cards(){return VW.map(function(v){return'<button class="mi" onclick="go(\''+v[0]+'\')"><b>'+v[3]+" "+t(v[1])+"</b><span>"+t(v[2])+"</span></button>"}).join("")}
function menu(o){$("menu").classList.toggle("on",!!o)}
function go(v){menu(0);ALLV.forEach(function(x){$("v-"+x).hidden=x!=v});$("fab").hidden=v=="chat";window.scrollTo(0,0);
if(v=="mapa")initMap();if(v=="stats")showStats();if(v=="chat")initChat();if(v=="granja")fillForm();if(v=="compartir"){$("shu").value=shareUrl();qrUpd()}}
function applyLang(){document.documentElement.lang=LANG=="qu"?"qu":LANG;
[].forEach.call(document.querySelectorAll("[data-i]"),function(e){e.textContent=t(e.getAttribute("data-i"))});
[].forEach.call(document.querySelectorAll("[data-h]"),function(e){e.innerHTML=t(e.getAttribute("data-h"))});
[].forEach.call(document.querySelectorAll("[data-p]"),function(e){e.placeholder=t(e.getAttribute("data-p"))});
$("lg").innerHTML=[["es","ES"],["en","EN"],["qu","QU"]].map(function(l){return'<button class="'+(LANG==l[0]?"on":"")+'" onclick="setLang(\''+l[0]+'\')">'+l[1]+"</button>"}).join("");
$("mg").innerHTML=cards();$("mg2").innerHTML=cards();$("how").innerHTML=tl("how").map(function(x){return"<li>"+x+"</li>"}).join("");
$("lsrc").innerHTML=tl("lsrc").map(function(x){return"<li>"+x+"</li>"}).join("");
$("learn").innerHTML=["s","h","f","i"].map(function(k,i){var n=[0,3,2,1][i];return"<details><summary>"+t("h"+n)+"</summary><ul>"+tl("a_"+k).map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul></details>"}).join("");
renderSub();if(MAPOK){renderMapUI();minfo();draw()}}
function setLang(l){LANG=l;ls("lang",l);applyLang();CH=[];$("msgs").innerHTML="";if(!$("v-chat").hidden)initChat();if(!$("v-granja").hidden){var f=FARM;fillForm()}if(!$("v-stats").hidden)showStats();if(!$("v-compartir").hidden)qrUpd();$("fok").innerHTML=""}
applyLang();go("inicio");
</script>
